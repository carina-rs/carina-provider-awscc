[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.9.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "6c5c0c5401b3f8cb0f42330d3cc855bf57426898" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "6c5c0c5401b3f8cb0f42330d3cc855bf57426898" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "6c5c0c5401b3f8cb0f42330d3cc855bf57426898" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "6c5c0c5401b3f8cb0f42330d3cc855bf57426898" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "6c5c0c5401b3f8cb0f42330d3cc855bf57426898" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "34db16e84edafb26a936f3a4e34ab17e75759715", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "34db16e84edafb26a936f3a4e34ab17e75759715" }
