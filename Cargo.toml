[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.10.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "f88e9d59b4139d6bed34f907d47f0c74a7551032" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "f88e9d59b4139d6bed34f907d47f0c74a7551032" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "f88e9d59b4139d6bed34f907d47f0c74a7551032" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "f88e9d59b4139d6bed34f907d47f0c74a7551032" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "f88e9d59b4139d6bed34f907d47f0c74a7551032" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "a95ba579596522369290cf36fe09092f11bb0395", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "a95ba579596522369290cf36fe09092f11bb0395" }
