[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.10.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "42976682015e82b565af58a74403e9e103d82bda" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "42976682015e82b565af58a74403e9e103d82bda" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "42976682015e82b565af58a74403e9e103d82bda" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "42976682015e82b565af58a74403e9e103d82bda" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "42976682015e82b565af58a74403e9e103d82bda" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "e7e597a26deca45dec8310f4ab76591485b68622", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "e7e597a26deca45dec8310f4ab76591485b68622" }
