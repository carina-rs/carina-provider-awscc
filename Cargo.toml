[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.9.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "ae8d2515d79ff27346f50ce7730863cdf436c1f7" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "ae8d2515d79ff27346f50ce7730863cdf436c1f7" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "ae8d2515d79ff27346f50ce7730863cdf436c1f7" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "ae8d2515d79ff27346f50ce7730863cdf436c1f7" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "ae8d2515d79ff27346f50ce7730863cdf436c1f7" }
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "42e67b0d6c1937bb5258a1c07fda45bbea5c0f24" }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "42e67b0d6c1937bb5258a1c07fda45bbea5c0f24" }
