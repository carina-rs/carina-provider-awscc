[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.9.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "7ab4f659c1e7a35e7362aa4c8cda22745e9ab338" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "7ab4f659c1e7a35e7362aa4c8cda22745e9ab338" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "7ab4f659c1e7a35e7362aa4c8cda22745e9ab338" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "7ab4f659c1e7a35e7362aa4c8cda22745e9ab338" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "7ab4f659c1e7a35e7362aa4c8cda22745e9ab338" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "0555595aa0bd653320db30f920e1e79d6a10887d", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "0555595aa0bd653320db30f920e1e79d6a10887d" }
