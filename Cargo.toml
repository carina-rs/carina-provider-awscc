[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.9.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "207e75101db9df9e1787219a79533e1e474c96cb" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "207e75101db9df9e1787219a79533e1e474c96cb" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "207e75101db9df9e1787219a79533e1e474c96cb" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "207e75101db9df9e1787219a79533e1e474c96cb" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "207e75101db9df9e1787219a79533e1e474c96cb" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "484e90981d031bb33d1c19be1b7042dd9b6b39b8", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "484e90981d031bb33d1c19be1b7042dd9b6b39b8" }
