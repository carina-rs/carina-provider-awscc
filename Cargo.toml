[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.11.1"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "ea66ae7a157bd6e28f374f80286a29eb8d77a557" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "ea66ae7a157bd6e28f374f80286a29eb8d77a557" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "ea66ae7a157bd6e28f374f80286a29eb8d77a557" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "ea66ae7a157bd6e28f374f80286a29eb8d77a557" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "ea66ae7a157bd6e28f374f80286a29eb8d77a557" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "825757d2ed7df8b7bd7c18201b517b7839fee8ae", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "825757d2ed7df8b7bd7c18201b517b7839fee8ae" }
