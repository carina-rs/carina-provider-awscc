[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.10.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "93110feca9f244f0ce88ebf02038fe7e8616765b" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "93110feca9f244f0ce88ebf02038fe7e8616765b" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "93110feca9f244f0ce88ebf02038fe7e8616765b" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "93110feca9f244f0ce88ebf02038fe7e8616765b" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "93110feca9f244f0ce88ebf02038fe7e8616765b" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "64e2c09743350734b56c9ff1ea9a7e73f8806bf6", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "64e2c09743350734b56c9ff1ea9a7e73f8806bf6" }
