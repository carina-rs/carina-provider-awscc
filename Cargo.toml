[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.10.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "516548de1d23d60b62ff6ae6a59c9478e29f5af0", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "516548de1d23d60b62ff6ae6a59c9478e29f5af0" }
