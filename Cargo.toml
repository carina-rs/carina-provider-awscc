[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.8.2"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "26524bb1" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "26524bb1" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "26524bb1" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "26524bb1" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "26524bb1" }
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "3c0cb2e" }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "3c0cb2e" }
