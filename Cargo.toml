[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.10.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "4311557b6f2408ab3108151a931fcf418f72fbb5" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "4311557b6f2408ab3108151a931fcf418f72fbb5" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "4311557b6f2408ab3108151a931fcf418f72fbb5" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "4311557b6f2408ab3108151a931fcf418f72fbb5" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "4311557b6f2408ab3108151a931fcf418f72fbb5" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "e46e5d0f1f12638ba1b2b58ead40ef1141fda7dc", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "e46e5d0f1f12638ba1b2b58ead40ef1141fda7dc" }
