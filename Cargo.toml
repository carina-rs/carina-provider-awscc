[workspace]
members = [
    "carina-provider-awscc",
]
resolver = "3"

[workspace.package]
version = "0.10.0"

# Every crate in this workspace must build against the same carina and
# carina-aws-types revisions; pin them once here so they cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "a3412b6be7ea881eb2e4e16ca2a045f09c9f3616" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "a3412b6be7ea881eb2e4e16ca2a045f09c9f3616" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "a3412b6be7ea881eb2e4e16ca2a045f09c9f3616" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "a3412b6be7ea881eb2e4e16ca2a045f09c9f3616" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "a3412b6be7ea881eb2e4e16ca2a045f09c9f3616" }
# Disable defaults here so every inherited dependency uses explicit service features.
carina-aws-types = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "69fef8545d08bc18efbf3f8bf19df7b6d6a61bca", default-features = false }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "69fef8545d08bc18efbf3f8bf19df7b6d6a61bca" }
