    { path = "aws_config::default_provider::credentials::DefaultCredentialsChain::builder", reason = "resolve base credentials through BoundedSdkConfig so wasm32 guests use host credentials" },
    { path = "aws_config::profile::ProfileFileCredentialsProvider::builder", reason = "resolve base credentials through BoundedSdkConfig so wasm32 guests use host credentials" },
    { path = "aws_config::environment::EnvironmentVariableCredentialsProvider::new", reason = "resolve base credentials through BoundedSdkConfig so wasm32 guests use host credentials" },
