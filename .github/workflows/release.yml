name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build
        run: cargo build --release --target wasm32-wasip2 --bin carina-provider-awscc

      - name: Optimize WASM with vela
        run: |
          cargo install --git https://github.com/mizzy/vela vela-cli --quiet
          vela optimize target/wasm32-wasip2/release/carina-provider-awscc.wasm -o target/wasm32-wasip2/release/carina-provider-awscc.wasm

      - name: Package
        run: |
          cp target/wasm32-wasip2/release/carina-provider-awscc.wasm carina-provider-awscc-${{ github.ref_name }}.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carina-provider-awscc-wasm
          path: carina-provider-awscc-${{ github.ref_name }}.wasm

  release:
    name: Create Release
    needs: [build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            carina-provider-awscc-*.wasm
          generate_release_notes: true
