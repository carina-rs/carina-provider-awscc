name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Test acceptance run registry
        run: bash acceptance-tests/shared/tests/run_registry_test.sh
      - run: cargo build -p carina-provider-awscc --target wasm32-wasip2 --release
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  acceptance-shell:
    name: Acceptance Shell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify jq dependency
        run: jq --version
      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          find . \
            -path './target' -prune -o \
            -path '*/.git' -prune -o \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run acceptance shell tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          # shell-tests require jq, but no AWS credentials or carina binary.
          for test_script in acceptance-tests/shell-tests/*.sh; do
            bash "$test_script"
          done

  docs-drift:
    name: Check Docs Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-docs-drift.sh

  carina-pin:
    name: Check carina-core Pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The script clones carina itself (filtered) to verify the
      # pinned rev is consistent and >= .carina-core-min-rev.
      - run: ./scripts/check-carina-pin.sh

  codegen-check:
    name: Codegen Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run schema codegen (from committed cache, no AWS calls)
        run: ./carina-provider-awscc/scripts/generate-schemas.sh --from-cache-only
      - name: Verify no uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Codegen produced uncommitted changes. Run 'aws-vault exec <profile> -- ./carina-provider-awscc/scripts/generate-schemas.sh' locally and commit the results (or commit cfn-schema-cache/ updates if AWS-side schemas changed)."
            exit 1
          fi

  # docs-drift and docs-check cover different gaps: docs-drift verifies each
  # schema has a tracked doc and catches missing/orphan files via a directory
  # scan, while docs-check regenerates docs and uses git diff to catch tracked
  # content drift.
  docs-check:
    name: Check Docs Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run docs generation (from committed cache, no AWS calls)
        run: ./scripts/generate-docs.sh --from-cache-only
      - name: Verify no uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Docs generation produced uncommitted changes. Run 'aws-vault exec <profile> -- ./scripts/generate-docs.sh' locally and commit the regenerated generated-docs/."
            exit 1
          fi

  docs-bundle:
    name: Docs Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test docs bundle tooling
        run: python3 -m unittest discover -s scripts -p 'test_docs_bundle.py'
      - name: Build docs bundle
        run: python3 scripts/docs-bundle.py build "$RUNNER_TEMP/carina-provider-awscc-docs.tar.gz"
      - name: Check shipped Markdown pages
        run: |
          rev=$(sed -n '/^name = "carina-docgen"$/,/^source/ { s/^source = ".*#\([0-9a-f]*\)"$/\1/p; }' Cargo.lock)
          test -n "$rev"
          cargo install --locked --git https://github.com/carina-rs/carina-provider-aws --rev "$rev" --features check-bin --bin carina-docgen-check carina-docgen
          carina-docgen-check "$RUNNER_TEMP/carina-provider-awscc-docs.tar.gz"
      - name: Validate docs bundle
        run: python3 scripts/docs-bundle.py check "$RUNNER_TEMP/carina-provider-awscc-docs.tar.gz"

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - run: cargo build -p carina-provider-awscc --target wasm32-wasip2 --release
      - name: Cache vela-cli
        id: cache-vela
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/vela
          key: vela-cli-${{ runner.os }}-4611418f8a84426b4b79077cae3f59357ca09ff7
      - name: Install vela-cli
        if: steps.cache-vela.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/mizzy/vela --rev 4611418f8a84426b4b79077cae3f59357ca09ff7 vela-cli --quiet
      - name: Optimize WASM with vela
        run: vela optimize target/wasm32-wasip2/release/carina-provider-awscc.wasm -o target/wasm32-wasip2/release/carina-provider-awscc.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: carina-provider-awscc.wasm
          path: target/wasm32-wasip2/release/carina-provider-awscc.wasm
          overwrite: true

  publish-dev:
    name: Publish to Carina Registry (dev)
    needs: [check, test, clippy, fmt, acceptance-shell, docs-drift, carina-pin, codegen-check, docs-check, docs-bundle, wasm-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      REGISTRY_AUDIENCE: registry-dev.carina-rs.dev
      REGISTRY_PUBLISH_URL: https://publish.registry-dev.carina-rs.dev/v1/publish
      ROLLING_RELEASE_TAG: main-builds
    steps:
      - name: Download WASM Artifact
        uses: actions/download-artifact@v4
        with:
          name: carina-provider-awscc.wasm

      - name: Prepare Publish Asset
        run: |
          set -euo pipefail

          short_sha=${GITHUB_SHA::7}
          version="0.0.0-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${short_sha}"
          mv carina-provider-awscc.wasm "carina-provider-awscc-${version}.wasm"
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      # Pin v2.6.5: the registry requires Rekor v1's SET; Rekor v2 issues no SET,
      # and cosign v3 defaults to signing-config, which routes to Rekor v2.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: Upload to Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! gh release view "$ROLLING_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$ROLLING_RELEASE_TAG" \
              --prerelease \
              --title "main builds" \
              --notes "Rolling container for 0.0.0-main.* dogfooding builds. The Carina registry records these asset download URLs; do not delete this release or its assets, or pinned 0.0.0-main.* resolution will break." \
              || true
            if ! gh release view "$ROLLING_RELEASE_TAG" >/dev/null 2>&1; then
              echo "Failed to create rolling release $ROLLING_RELEASE_TAG" >&2
              exit 1
            fi
          fi
          gh release upload "$ROLLING_RELEASE_TAG" "carina-provider-awscc-${VERSION}.wasm"

      - name: Sign WASM Artifact (keyless)
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if cosign sign-blob "carina-provider-awscc-${VERSION}.wasm" \
              --bundle sigstore-bundle.json \
              --new-bundle-format=true \
              --yes; then
              break
            fi

            printf 'Signing attempt %s failed\n' "$attempt" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 10
              continue
            fi
            printf 'Signing failed after 3 attempts\n' >&2
            exit 1
          done

      - name: Publish to Carina Registry
        # For a 403 claim_mismatch, verify that the providers.awscc trusted-publisher
        # policy uses the main-branch-only sentinel and points to
        # .github/workflows/ci.yml.
        run: |
          set -euo pipefail

          if ! jq -e 'type == "object"' sigstore-bundle.json >/dev/null; then
            echo "sigstore-bundle.json is missing or not a JSON object" >&2
            exit 1
          fi

          version="$VERSION"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROLLING_RELEASE_TAG}/carina-provider-awscc-${version}.wasm"
          payload=$(jq -n \
            --arg version "$version" \
            --arg asset_url "$asset_url" \
            --slurpfile bundle sigstore-bundle.json \
            '{
              namespace: "carina-rs",
              name: "awscc",
              version: $version,
              candidate_download_url: $asset_url,
              sigstore_bundle: $bundle[0]
            }')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          # The Fulcio cert from the sign step lives ~10 minutes and must still be valid
          # when the registry verifies a new version's bundle; this loop's worst case
          # (3 x (60s token + 120s POST) + 2 x 10s sleep) nearly exhausts it, so do not
          # add attempts, sleeps, or timeout headroom here.
          for attempt in 1 2 3; do
            if ! token=$(curl -sS \
              --connect-timeout 10 \
              --max-time 60 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY_AUDIENCE}" \
              | jq -er .value) || [ -z "$token" ]; then
              printf 'Failed to obtain OIDC token on attempt %s\n' "$attempt" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep 10
                continue
              fi
              printf 'Publish failed after 3 attempts while obtaining OIDC token\n' >&2
              exit 1
            fi

            : > "$response_file"
            if ! status=$(curl -sS \
              --connect-timeout 10 \
              --max-time 120 \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$REGISTRY_PUBLISH_URL"); then
              status=000
            fi

            printf 'Publish attempt %s returned HTTP %s\n' "$attempt" "$status"
            sed 's/^/  /' "$response_file"
            printf '\n'

            case "$status" in
              200|201)
                exit 0
                ;;
              000|429|5??)
                if [ "$attempt" -lt 3 ]; then
                  sleep 10
                  continue
                fi
                printf 'Publish failed after 3 attempts (last status: %s)\n' "$status" >&2
                exit 1
                ;;
              4??)
                printf 'Publish failed with non-retryable status %s\n' "$status" >&2
                exit 1
                ;;
              *)
                printf 'Publish failed with unexpected status %s\n' "$status" >&2
                exit 1
                ;;
            esac
          done
